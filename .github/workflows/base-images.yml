name: Base images

on:
  pull_request:
    paths: [images/**, test/base-image*, .github/workflows/base-images.yml]
  push:
    branches: [main]
    paths: [images/**, test/base-image*, .github/workflows/base-images.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: registry@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
  CRANE_IMAGE: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
  IMAGE_ROOT: ghcr.io/rubio-enterprises/devcontainers

jobs:
  build:
    name: Build and smoke (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
          - arch: arm64
            runner: ${{ fromJSON(vars.RUNNERS || '{}').arm || fromJSON('["ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      REGISTRY_NAME: base-images-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the layer inspection contract
        run: bash test/base-image-layout-test.sh
      - name: Install the Dev Container CLI
        run: >-
          npm install --prefix "$RUNNER_TEMP/devcontainer-cli" --ignore-scripts --no-audit --no-fund
          @devcontainers/cli@0.89.0
      - name: Require native Docker and start a job-local registry
        run: |
          set -euo pipefail
          docker buildx version
          actual=$(docker info --format '{{.Architecture}}')
          case "$ARCH:$actual" in
            amd64:x86_64|amd64:amd64|arm64:aarch64|arm64:arm64) ;;
            *) echo "::error::Native Docker architecture mismatch"; exit 1 ;;
          esac
          docker run -d --rm --name "$REGISTRY_NAME" -p 127.0.0.1::5000 "$REGISTRY_IMAGE"
          port=$(docker port "$REGISTRY_NAME" 5000/tcp)
          echo "LOCAL=localhost:${port##*:}/base-images" >> "$GITHUB_ENV"
      - name: Build the baseline base and resolve its platform manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base-workspace" "$RUNNER_TEMP/base-images"
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" build \
            --workspace-folder "$RUNNER_TEMP/base-workspace" \
            --config "$GITHUB_WORKSPACE/images/base/devcontainer.json" \
            --platform "linux/$ARCH" --output type=docker \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --image-name "$LOCAL/base:build"
          docker push --platform "linux/$ARCH" "$LOCAL/base:build"
          digest=$(docker run --rm --network host "$CRANE_IMAGE" digest --insecure \
            --platform "linux/$ARCH" "$LOCAL/base:build")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "BASE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Build base-ci from that exact base manifest
        run: |
          set -euo pipefail
          docker build --platform "linux/$ARCH" --provenance=false --sbom=false \
            --build-arg BASE="$LOCAL/base@$BASE_DIGEST" --build-arg BASE_DIGEST="$BASE_DIGEST" \
            -f images/base-ci/Dockerfile -t "$LOCAL/base-ci:build" images/base-ci
          docker push --platform "linux/$ARCH" "$LOCAL/base-ci:build"
      - name: Smoke both image contracts and inspect every layer
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/base-images"
          bash test/base-images.sh "$LOCAL/base:build" "$LOCAL/base-ci:build" "$ARCH" "$BASE_DIGEST" "$out"
          for image in base base-ci; do
            digest=$(docker run --rm --network host "$CRANE_IMAGE" digest --insecure \
              --platform "linux/$ARCH" "$LOCAL/$image:build")
            rm -rf "${out:?}/${image:?}"
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -v "$out:/out" "$CRANE_IMAGE" pull --insecure --format oci \
              --platform "linux/$ARCH" "$LOCAL/$image@$digest" "/out/$image"
            bash test/base-image-layout.sh "$out/$image" "$digest"
            printf '%s\n' "$digest" > "$out/$image.digest"
          done
          test "$(<"$out/base.digest")" = "$BASE_DIGEST"
          ci_digest=$(<"$out/base-ci.digest")
          jq -e --slurpfile base "$out/base/blobs/sha256/${BASE_DIGEST#sha256:}" \
            '[.layers[].digest] as $layers | [$base[0].layers[].digest] as $prefix
             | ($layers | length) > ($prefix | length)
               and $layers[0:($prefix | length)] == $prefix' \
            "$out/base-ci/blobs/sha256/${ci_digest#sha256:}"
      - name: Install checksum-pinned Trivy
        run: |
          set -euo pipefail
          version=0.76.1
          case "$ARCH" in
            amd64) platform=64bit; checksum=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 ;;
            arm64) platform=ARM64; checksum=e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-${platform}.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy
      - name: Scan both local images and their configuration for secrets
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/base-images-trivy-cache"' EXIT
          # Matched secret values must never appear in logs or artifacts.
          # shellcheck disable=SC2016
          template='{{ range . }}{{ $target := .Target }}{{ range .Secrets }}
          {{ printf "%s:%d-%d: %s (%s)\n" $target .StartLine .EndLine .RuleID .Severity }}
          {{ end }}{{ end }}'
          for image in base base-ci; do
            "$RUNNER_TEMP/trivy/trivy" image --image-src docker \
              --scanners secret --image-config-scanners secret --exit-code 1 \
              --config '' --ignorefile '' --cache-dir "$RUNNER_TEMP/base-images-trivy-cache" \
              --disable-telemetry --skip-version-check --timeout 15m \
              --format template --template "$template" "$LOCAL/$image:build"
          done
      - name: Archive digest-preserving OCI layouts
        run: |
          tar -C "$RUNNER_TEMP/base-images" -cf "$RUNNER_TEMP/base-images/oci-images.tar" \
            base base-ci base.digest base-ci.digest base-config.json base-ci-config.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: base-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/base-images/oci-images.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Remove only this job's local registry and image tags
        if: always()
        run: |
          docker rm -fv "$REGISTRY_NAME" || true
          if [ -n "${LOCAL:-}" ]; then docker image rm "$LOCAL/base:build" "$LOCAL/base-ci:build" || true; fi

  publish:
    name: Publish both multi-architecture images
    needs: build
    if: >-
      contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: base-images-*
          path: ${{ runner.temp }}/base-image-artifacts
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the verified manifests without rewriting their digests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/base-image-artifacts"
          auth="${DOCKER_CONFIG:-$HOME/.docker}"
          for arch in amd64 arm64; do
            directory="$root/base-images-$arch"
            tar -C "$directory" -xf "$directory/oci-images.tar"
            for image in base base-ci; do
              digest=$(<"$directory/$image.digest")
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              docker run --rm --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/auth \
                -v "$directory:/images:ro" -v "$auth:/auth:ro" \
                "$CRANE_IMAGE" push "/images/$image" "$IMAGE_ROOT/$image:sha-$GITHUB_SHA-$arch"
              published=$(docker run --rm --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/auth \
                -v "$auth:/auth:ro" "$CRANE_IMAGE" \
                digest "$IMAGE_ROOT/$image:sha-$GITHUB_SHA-$arch")
              test "$published" = "$digest"
            done
          done
          for image in base base-ci; do
            docker run --rm --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/auth \
              -v "$auth:/auth:ro" "$CRANE_IMAGE" index append \
              -m "$IMAGE_ROOT/$image:sha-$GITHUB_SHA-amd64" \
              -m "$IMAGE_ROOT/$image:sha-$GITHUB_SHA-arm64" \
              -t "$IMAGE_ROOT/$image:sha-$GITHUB_SHA"
          done
          for image in base base-ci; do
            docker run --rm --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/auth \
              -v "$auth:/auth:ro" "$CRANE_IMAGE" \
              tag "$IMAGE_ROOT/$image:sha-$GITHUB_SHA" latest
          done
